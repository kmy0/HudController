name: Release

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake (HudController_util)
        run: cmake -S ${{ github.workspace }}/deps/HudController_util -B ${{ github.workspace }}/deps/HudController_util/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build HudController_util
        run: cmake --build ${{ github.workspace }}/deps/HudController_util/build --config ${{ env.BUILD_TYPE }}

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: hudcontroller-dll
          path: deps/HudController_util/bin/*.dll
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: hudcontroller-dll
          path: dll

      - name: Generate version + package (native Linux zip)
        run: |
          BASE_VERSION=$(git describe --tags --always)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')

          if [ "$BRANCH_NAME" != "main" ]; then
            RELEASE_VERSION="${BASE_VERSION}+${CLEAN_BRANCH}"
            COMMIT_VERSION="${BASE_VERSION}+${BRANCH_NAME}"
          else
            RELEASE_VERSION="$BASE_VERSION"
            COMMIT_VERSION="$BASE_VERSION"
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

          mkdir -p reframework/plugins reframework/autorun/HudController/config
          cp dll/*.dll reframework/plugins/

          cat > reframework/autorun/HudController/config/version.lua << EOT
          return {
              version = "$(git describe --tags --abbrev=0 2>/dev/null || echo "$BASE_VERSION")",
              commit = "$COMMIT_VERSION",
          }
          EOT

          zip -r -X "HudController-${RELEASE_VERSION}.zip" reframework

          echo "--- zip contents ---"
          unzip -Z1 "HudController-${RELEASE_VERSION}.zip"
          if unzip -Z1 "HudController-${RELEASE_VERSION}.zip" | grep -q '\\'; then
            echo "ERROR: backslash in zip entry names" >&2
            exit 1
          fi

      - name: Create Release (main repository)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "${{ env.RELEASE_VERSION }}"
          tag: "${{ env.RELEASE_VERSION }}"
          artifacts: "HudController-*.zip"
          generateReleaseNotes: true
          draft: true
          makeLatest: true