
name: Check documentation links

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Validate Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            './**/*.md'
          fail: true
